   <g id="text_1">
    <text style="font-weight: 700; font-size: 25px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #193047" x="46.8" y="43.2" transform="rotate(-0 46.8 43.2)">01  /  Full-volume reconstruction</text>
   </g>
   <g id="text_2">
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #526477" x="46.8" y="77.04" transform="rotate(-0 46.8 77.04)">Question: what survives compression when the model sees the complete state?</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #193047" x="131.4" y="171.623125" transform="rotate(-0 131.4 171.623125)">Complete volume</text>
   </g>
   <g id="text_4">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #193047" transform="translate(79.261875 210.864844)">Ne · Te · Ti · φ · Vi</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #193047" transform="translate(75.454688 227.037656)">64 × 32 × 81 cells</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #193047" x="345.6" y="171.623125" transform="rotate(-0 345.6 171.623125)">3D encoder</text>
   </g>
   <g id="text_6">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #193047" transform="translate(282.270937 210.864844)">Shared convolutional</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #193047" transform="translate(309.06 227.037656)">DC-AE trunk</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #193047" x="576" y="160.823125" transform="rotate(-0 576 160.823125)">Spatial latent z</text>
   </g>
   <g id="text_8">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #193047" transform="translate(497.795625 210.864844)">64 channels × 8 × 4 × 11</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #193047" transform="translate(505.667812 227.037656)">22,528 stored numbers</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #193047" x="806.4" y="171.623125" transform="rotate(-0 806.4 171.623125)">3D decoder</text>
   </g>
   <g id="text_10">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #193047" transform="translate(749.528437 210.864844)">Learned expansion</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #193047" transform="translate(769.468125 227.037656)">to five fields</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #193047" x="1020.6" y="171.623125" transform="rotate(-0 1020.6 171.623125)">Reconstruction</text>
   </g>
   <g id="text_12">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #193047" transform="translate(979.442813 210.864844)">Same volume</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #193047" transform="translate(988.115625 227.037656)">Same time</text>
   </g>
   <g id="text_13">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #193047" x="50.4" y="311.518125" transform="rotate(-0 50.4 311.518125)">Before encoding: native toroidal grid 81 → 88; log-density transform and fitting-only normalization.</text>
   </g>
   <g id="text_14">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #193047" x="50.4" y="346.078125" transform="rotate(-0 50.4 346.078125)">After decoding: inverse transforms and toroidal grid 88 → 81; score in physical fields on native cells.</text>
   </g>
   <g id="text_15">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #193047" x="576" y="410.608437" transform="rotate(-0 576 410.608437)">Training: encoder and decoder learn together</text>
   </g>
   <g id="text_16">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #193047" transform="translate(399.139688 444.504844)">½ normalized mean error + ½ normalized fluctuation error</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #193047" transform="translate(405.452812 460.677656)">Five fields, native volume weights, boundary supervision</text>
   </g>
   <g id="text_17">
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #193047" x="54" y="541.237969" transform="rotate(-0 54 541.237969)">Mean = instantaneous toroidal n=0. Fluctuation = full field minus that mean.</text>
   </g>
   <g id="text_18">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #193047" x="54" y="582.958125" transform="rotate(-0 54 582.958125)">The latent is a grid of learned features, not 64 physical variables. No input bypasses the bottleneck.</text>
   </g>
   <g id="text_19">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #193047" x="54" y="621.798281" transform="rotate(-0 54 621.798281)">Reference: balanced boundary-supervised shared codec. Flux, spectra and cross-phase are evaluated separately.</text>
   </g>
  </g>
