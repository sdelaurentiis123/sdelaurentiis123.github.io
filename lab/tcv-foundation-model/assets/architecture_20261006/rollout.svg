   <g id="text_1">
    <text style="font-weight: 700; font-size: 25px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #193047" x="46.8" y="43.2" transform="rotate(-0 46.8 43.2)">03  /  Temporal rollout</text>
   </g>
   <g id="text_2">
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #526477" x="46.8" y="77.04" transform="rotate(-0 46.8 77.04)">Question: can a learned evolution rule advance the compressed plasma state through time?</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #193047" x="131.4" y="167.968438" transform="rotate(-0 131.4 167.968438)">Recent history</text>
   </g>
   <g id="text_4">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #193047" transform="translate(79.810313 201.864844)">Four full volumes</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #193047" transform="translate(84.014063 218.037656)">t−3, t−2, t−1, t</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #193047" x="329.4" y="168.023125" transform="rotate(-0 329.4 168.023125)">Frozen encoder</text>
   </g>
   <g id="text_6">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #193047" transform="translate(259.495313 201.864844)">Same pretrained codec</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #193047" transform="translate(266.822813 218.037656)">Encode each volume</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #193047" x="527.4" y="167.968438" transform="rotate(-0 527.4 167.968438)">Latent history</text>
   </g>
   <g id="text_8">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #193047" transform="translate(472.84125 201.864844)">Four spatial codes</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #193047" transform="translate(493.68 218.037656)">[zₜ₋₃, …, zₜ]</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #193047" x="759.6" y="167.968438" transform="rotate(-0 759.6 167.968438)">Trainable dynamics</text>
   </g>
   <g id="text_10">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #193047" transform="translate(692.0175 201.864844)">Spatial convolutions +</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #193047" transform="translate(681.990937 218.037656)">causal temporal attention</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #193047" x="1006.2" y="168.023125" transform="rotate(-0 1006.2 168.023125)">Next latent</text>
   </g>
   <g id="text_12">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #193047" transform="translate(965.852812 201.864844)">ẑₜ₊₁ = zₜ + Δz</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #193047" transform="translate(935.506875 218.037656)">Deterministic reference</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #193047" x="1006.2" y="333.623125" transform="rotate(-0 1006.2 333.623125)">Frozen decoder</text>
   </g>
   <g id="text_14">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #193047" x="1006.2" y="370.15125" transform="rotate(-0 1006.2 370.15125)">Next physical volume</text>
   </g>
   <g id="text_15">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #526477" x="752.4" y="102.96" transform="rotate(-0 752.4 102.96)">Append predicted latent; drop oldest; repeat</text>
   </g>
   <g id="text_16">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #193047" x="448.2" y="322.823125" transform="rotate(-0 448.2 322.823125)">Diffusion alternative: replace the next-latent prediction step</text>
   </g>
   <g id="text_17">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #193047" transform="translate(262.723125 363.864844)">History + noisy future latent + noise levels → causal denoiser</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #193047" transform="translate(223.005937 380.037656)">32 DDIM denoising steps → next latent → same decoder and feedback loop</text>
   </g>
   <g id="text_18">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #193047" x="54" y="471.358125" transform="rotate(-0 54 471.358125)">Deterministic training: four-step rollout loss in decoded physical fields. Encoder/decoder stay frozen.</text>
   </g>
   <g id="text_19">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #193047" x="54" y="513.838125" transform="rotate(-0 54 513.838125)">Diffusion training: denoising loss in normalized latent space; sampled outputs are scored physically.</text>
   </g>
   <g id="text_20">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #193047" x="54" y="556.318125" transform="rotate(-0 54 556.318125)">Latest ablation: next-token loss versus loss across all noised sequence positions.</text>
   </g>
   <g id="text_21">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #193047" x="54" y="597.358125" transform="rotate(-0 54 597.358125)">This diagram shows full-volume forecasting. Sparse-observation transfer is a later conditioning task.</text>
   </g>
   <g id="text_22">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #193047" x="54" y="631.878281" transform="rotate(-0 54 631.878281)">Current sampler predicts one next state at a time; rolling-block Diffusion Forcing is not implemented here.</text>
   </g>
  </g>
