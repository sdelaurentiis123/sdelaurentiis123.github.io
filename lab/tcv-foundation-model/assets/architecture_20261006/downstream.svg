   <g id="text_1">
    <text style="font-weight: 700; font-size: 25px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #193047" x="46.8" y="43.2" transform="rotate(-0 46.8 43.2)">02  /  Upstream → downstream</text>
   </g>
   <g id="text_2">
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #526477" x="46.8" y="77.04" transform="rotate(-0 46.8 77.04)">Question: can the pretrained spatial representation infer regions we do not observe?</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #193047" x="133.2" y="160.823125" transform="rotate(-0 133.2 160.823125)">Observed plane</text>
   </g>
   <g id="text_4">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #193047" transform="translate(76.789688 210.864844)">Five physical fields</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #193047" transform="translate(64.727813 227.037656)">One upstream location</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #193047" x="356.4" y="160.768438" transform="rotate(-0 356.4 160.768438)">Full-grid input canvas</text>
   </g>
   <g id="text_6">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #193047" transform="translate(290.427188 202.778437)">Keep observed values</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #193047" transform="translate(279.915 218.95125)">Fill hidden cells with prior</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #193047" transform="translate(266.30625 235.124062)">Add learned mask embedding</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #193047" x="572.4" y="160.823125" transform="rotate(-0 572.4 160.823125)">Encoder</text>
   </g>
   <g id="text_8">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #193047" transform="translate(531.42375 202.778437)">Initialize from</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #193047" transform="translate(529.065 218.95125)">reconstruction</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #193047" transform="translate(519.147187 235.124062)">Fine-tune weights</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #193047" x="757.8" y="160.823125" transform="rotate(-0 757.8 160.823125)">Latent z</text>
   </g>
   <g id="text_10">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #193047" transform="translate(705.238125 210.864844)">Same spatial grid</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #193047" transform="translate(708.35625 227.037656)">22,528 numbers</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #193047" x="986.4" y="160.823125" transform="rotate(-0 986.4 160.823125)">Decoder → native fields</text>
   </g>
   <g id="text_12">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #193047" transform="translate(908.082188 202.778437)">Decode the whole volume</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #193047" transform="translate(906.801563 218.95125)">Fine-tune decoder weights</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #193047" transform="translate(909.598125 235.124062)">Score downstream region</text>
   </g>
   <g id="text_13">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #193047" x="50.4" y="310.078125" transform="rotate(-0 50.4 310.078125)">Observed native plane: y=18 on 85604; y=17 on 85606; radial cells x ≥ 16.</text>
   </g>
   <g id="text_14">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #193047" x="302.4" y="380.423125" transform="rotate(-0 302.4 380.423125)">Main task: infer the hidden downstream state</text>
   </g>
   <g id="text_15">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #193047" transform="translate(221.14875 419.664844)">Input: upstream plane only</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #193047" transform="translate(122.28 435.837656)">Loss: downstream truth versus predicted downstream fields</text>
   </g>
   <g id="text_16">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #193047" x="840.6" y="380.368438" transform="rotate(-0 840.6 380.368438)">Optional clean replay — training only</text>
   </g>
   <g id="text_17">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #193047" transform="translate(629.20125 419.664844)">Separate complete volume → same encoder/decoder → reconstruction</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #193047" transform="translate(683.138438 435.837656)">No hidden truth is supplied to the downstream input</text>
   </g>
   <g id="text_18">
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #193047" x="54" y="523.237969" transform="rotate(-0 54 523.237969)">With clean replay: downstream loss + 0.5 × clean reconstruction loss (the tested replay recipe).</text>
   </g>
   <g id="text_19">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #193047" x="54" y="570.718125" transform="rotate(-0 54 570.718125)">Both tasks update the same weights. Replay is an extra training example, not an extra inference input.</text>
   </g>
   <g id="text_20">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #193047" x="54" y="613.878281" transform="rotate(-0 54 613.878281)">Clean target-shot replay preserves a task; replaying source-shot examples is a separate choice for shot retention.</text>
   </g>
  </g>
 </g>
